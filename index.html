<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenggat</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- Link ikon -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
  <!-- pembungkus seluruh halaman -->
  <div class="app-container">
    <!-- section kiri -->
    <aside class="sidebar">
        <!-- Kelompok Atas -->
      <div class="sidebar-top">
        <div class="brand-logo">
          <i class="ri-compass-3-fill"></i>
        </div>
        <button class="icon-btn has-badge" title="Keranjang">
          <i class="ri-shopping-basket-line"></i>
        </button>
      </div>

      <!-- Kelompok Tengah (Menu Utama) -->
      <nav class="sidebar-menu">
        <button class="icon-btn active" title="Beranda">
          <i class="ri-home-5-line"></i>
        </button>
        <button class="icon-btn" title="Jadwal">
          <i class="ri-calendar-line"></i>
        </button>
        <button class="icon-btn" title="Materi">
          <i class="ri-book-open-line"></i>
        </button>
        <button class="icon-btn" title="Kategori">
          <i class="ri-apps-2-line"></i>
        </button>
      </nav>

      <!-- Kelompok Bawah -->
      <div class="sidebar-bottom">
        <button class="icon-btn" title="Pengaturan">
          <i class="ri-settings-3-line"></i>
        </button>
        <img src="./assets/images/myFoto.png" alt="Profil" class="sidebar-avatar">
      </div>
    </aside>

    <!-- section tengah -->
    <aside class="main-content">

    </aside>

    <!-- section kanan -->
    <aside class="right-panel">

    </aside>
  </div>
</body>
</html>
